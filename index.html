<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行手帖</title>
<meta name="description" content="可以自己編輯、離線使用的旅行行程手帖">
<meta name="theme-color" content="#F7FAFD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅行手帖">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: snowy picture-book hero → trip card → sticky tabs (days + lists + info + backup) with walking kid → timeline of hand-drawn cards. Floating edit toggle. Single light "snow" theme by design. */
:root{
  color-scheme:light;
  --bg:#F7FAFD; --surface:#FFFFFF; --ink:#2E3A4B; --muted:#5F6C84; --line:#2E3A4B; --soft:#E2E9F2;
  --ice:#A9CFEA; --lav:#CBBEEA; --pine:#A8D2BE; --lamp:#F6C98A; --berry:#F2A0AE;
  --skin:#F8DCC6;
  --bw:3px; --r-lg:22px; --r-md:16px; --r-sm:10px;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero */
.hero{display:block;width:100%;max-width:680px;height:auto;margin:4px auto 0}
.flake{animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(96px);opacity:0}}
.hero .fox{transform-origin:250px 98px;animation:sway 3.4s ease-in-out infinite}
.hero .foxtail{transform-origin:266px 92px;animation:wag 1.8s ease-in-out infinite}
.hero .smoke{animation:drift 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}

header{padding-block:6px 16px}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,9vw,44px);line-height:1.15;margin:4px 0 6px;text-wrap:balance}
h1 .mark{background:var(--ice);border-radius:12px;padding:0 .16em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{color:var(--muted);margin:0;font-size:14px}
.count{margin-top:12px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;padding:10px 16px;border:var(--bw) solid var(--line);border-radius:var(--r-lg);background:var(--lamp)}
.count .num{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.count .lbl{font-size:13px}
.sample{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border:var(--bw) dashed var(--line);border-radius:var(--r-md);background:var(--surface);font-size:14px}
.sample b{font-family:var(--f-display);font-weight:400}

/* tabs + walker */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.tabscroll{overflow-x:auto;scrollbar-width:none}
.tabscroll::-webkit-scrollbar{display:none}
.tabinner{display:inline-flex;flex-direction:column;min-width:100%;width:max-content}
.tabs{display:flex;gap:6px;padding-block:10px 0}
.tab{flex:0 0 auto;border:2px solid transparent;background:none;font-family:var(--f-display);font-size:14px;padding:6px 10px;border-radius:var(--r-md);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;transition:transform .25s var(--pop)}
.tab small{font-size:10.5px;color:var(--muted)}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--ice);border-color:var(--line)}
.tab[aria-selected="true"] .ico{animation:wiggle 2.6s ease-in-out infinite}
.tab.add{border:2px dashed var(--line);color:var(--muted)}
.tab .today{font-size:10px;background:var(--lamp);border-radius:999px;padding:0 6px;margin-top:2px}
.ico{width:24px;height:24px;flex:0 0 auto}
.tab .ico{width:26px;height:26px;margin-bottom:2px}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}
.walkway{position:relative;height:44px}
.walkway::after{content:"";position:absolute;left:8px;right:8px;bottom:5px;border-bottom:3px dotted var(--line)}
#walker{position:absolute;bottom:7px;left:0;width:30px;height:38px;z-index:1;transition:left .9s ease-in-out}
#walker .fig{transform-origin:15px 19px;transition:transform .2s}
#walker.left .fig{transform:scaleX(-1)}
#walker .bodyg{animation:idle 2s ease-in-out infinite}
#walker.walking .legL{animation:stepA .22s ease-in-out infinite alternate}
#walker.walking .legR{animation:stepB .22s ease-in-out infinite alternate}
#walker.walking .bodyg{animation:bob .22s ease-in-out infinite alternate}
.legL{transform-origin:11.5px 26px}.legR{transform-origin:16.5px 26px}
@keyframes stepA{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes stepB{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}

/* page */
main{padding-block:20px 120px}
#main.bounce{animation:pageIn .55s var(--pop)}
@keyframes pageIn{0%{transform:translateY(18px) scale(.97);opacity:.2}60%{transform:translateY(-6px) scale(1.01);opacity:1}100%{transform:none}}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;margin-bottom:8px}
.dayhead .hl{display:flex;align-items:center;gap:10px;min-width:0}
.dayhead h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.mascot{width:46px;height:46px;flex:0 0 auto;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.progress{font-size:12px;background:var(--pine);border:2px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap}
.dayintro{color:var(--muted);margin:0 0 14px;max-width:60ch;white-space:pre-line}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:0 0 16px}
.legend i{display:inline-block;width:16px;height:12px;margin-right:4px;vertical-align:-1px;border-radius:4px;border:2px solid var(--line);background:var(--surface)}
.legend .l2{background:var(--berry)}.legend .l3{border-style:dashed}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:58px 1fr;gap:10px;position:relative;padding-bottom:16px}
.stop::before{content:"";position:absolute;left:28px;top:30px;bottom:0;border-left:3px dotted var(--line);opacity:.5}
.stop:last-child::before{display:none}
.time{padding-top:10px;text-align:center;position:relative;z-index:1}
.time span{display:inline-block;font-family:var(--f-display);font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:1px 6px;min-width:44px}
.card{min-width:0;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-md);padding:12px 14px;transition:opacity .2s}
.card.star{background:var(--berry)}
.card.star .body,.card.star .body li{color:var(--ink)}
.card.flex{border-style:dashed}
.done .card{opacity:.5}
.done .card h3{text-decoration:line-through}
.row{display:flex;gap:10px;align-items:flex-start}
.row .txt{flex:1;min-width:0}
.card h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0;line-height:1.4;overflow-wrap:anywhere}
.body{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.body p{margin:6px 0 0}
.body ul{margin:6px 0 0;padding-left:18px}
.body a{color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a,.pill{font-size:13px;color:var(--ink);text-decoration:none;background:var(--pine);border:2px solid var(--line);border-radius:999px;padding:1px 10px}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:0 0 26px;border:var(--bw) solid var(--line);border-radius:8px;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--surface);transition:transform .25s var(--pop)}
.chk:active{transform:scale(.85)}
.chk:checked{background:var(--pine)}
.chk:checked::after{content:"";width:11px;height:6px;border:3px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;transition:transform .2s var(--pop)}
.tbtn:active{transform:scale(.92)}
.tbtn.edit{background:var(--lamp)}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;padding:10px;border:var(--bw) dashed var(--line);border-radius:var(--r-md);background:var(--surface);font-family:var(--f-display);font-size:15px;cursor:pointer}
.addbtn:active{transform:scale(.98)}
.empty{text-align:center;color:var(--muted);padding:26px 16px;border:var(--bw) dashed var(--line);border-radius:var(--r-lg);background:var(--surface)}
.empty .mascot{width:64px;height:64px;margin:0 auto 6px;display:block}
.note{margin-top:18px;padding:12px 14px;border-radius:var(--r-md);border:var(--bw) dashed var(--line);font-size:14px;color:var(--muted);background:var(--surface)}
.note b{color:var(--ink)}

/* lists */
.sec{font-family:var(--f-display);font-weight:400;font-size:19px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec:first-of-type{margin-top:4px}
.sec .cnt{font-size:12px;background:var(--pine);border:2px solid var(--line);border-radius:999px;padding:0 8px;font-family:var(--f-body)}
.items{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);font-size:13px;white-space:pre-line}
.item.done .t>span{text-decoration:line-through;opacity:.55}
.mini{border:2px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;flex:0 0 30px;cursor:pointer;font-size:14px;line-height:1;display:grid;place-content:center}
.quick{display:flex;gap:8px;margin-top:8px}
.quick input{flex:1;min-width:0;border:var(--bw) solid var(--line);border-radius:var(--r-md);padding:8px 12px;background:var(--surface)}
.quick button{border:var(--bw) solid var(--line);border-radius:var(--r-md);background:var(--ice);padding:0 14px;font-family:var(--f-display);cursor:pointer}

/* info */
.group{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:12px}
.group h3{margin:0;padding:10px 14px;font-family:var(--f-display);font-weight:400;font-size:17px;background:var(--ice);border-bottom:var(--bw) solid var(--line);display:flex;gap:8px;align-items:center}
.group h3 span{flex:1;min-width:0}
.irow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:9px 14px;border-bottom:2px solid var(--soft)}
.irow:last-child{border-bottom:0}
.irow .k{font-size:12px;color:var(--muted);flex:0 0 100%}
.irow .v{font-family:var(--f-display);font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-line;-webkit-user-select:all;user-select:all}
.irow .acts{display:flex;gap:6px}

/* settings */
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:14px;margin-top:14px}
.panel h3{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:18px}
.panel p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{border:var(--bw) solid var(--line);border-radius:999px;padding:7px 16px;font-family:var(--f-display);font-size:15px;cursor:pointer;background:var(--ice);transition:transform .2s var(--pop);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.95)}
.btn.y{background:var(--lamp)}.btn.g{background:var(--pine)}.btn.r{background:var(--berry)}.btn.w{background:var(--surface)}
.steps{list-style:none;counter-reset:st;margin:10px 0 0;padding:0;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:2px 0 2px 36px;font-size:14px}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--ice);border:2px solid var(--line);display:grid;place-content:center;font-family:var(--f-display);font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{border:2px solid var(--line);background:var(--surface);padding:3px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--lamp)}
.ver{font-size:12px;color:var(--muted);margin-top:18px;text-align:center}

/* pager */
.maps{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mapbtn{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:var(--ice);border:var(--bw) solid var(--line);border-radius:var(--r-md);color:var(--ink);text-decoration:none;min-width:0;transition:transform .25s var(--pop)}
.mapbtn.m1{background:var(--berry)}.mapbtn.m2{background:var(--pine)}.mapbtn.m3{background:var(--lav)}
.mapbtn:active{transform:scale(.96)}
.mapbtn .ico{margin-top:2px}
.mapbtn span{min-width:0}
.mapbtn b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px}
.mapbtn small{display:block;font-size:11.5px;line-height:1.4;overflow-wrap:anywhere}
.errs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.err{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0}
.err.got{opacity:.55}
.err.got h3{text-decoration:line-through}
.err .pic{position:relative;background:#FFFFFF;border-bottom:var(--bw) solid var(--line);height:190px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.err .pic.noimg{height:90px;background:var(--soft)}
.err .pic.noimg .ico{width:52px;height:52px}
.err .pic img{display:block;width:100%;height:100%;max-height:190px;object-fit:contain}
.einfo{position:relative;background:var(--surface);padding:12px 14px 14px;min-width:0}
.einfo h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0;line-height:1.4;overflow-wrap:anywhere}
.einfo .en{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:11.5px;padding:0 8px;border-radius:999px;background:var(--ice);border:2px solid var(--line);white-space:nowrap;line-height:1.6}
.chip.y{background:var(--lamp)}.chip.g{background:var(--pine)}
.price{margin-top:8px;display:inline-block;font-family:var(--f-display);font-size:14px;background:var(--ice);border:2px solid var(--line);border-radius:var(--r-sm);padding:1px 8px}
.where{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wcard{min-width:0;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.wtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.wtop b{font-family:var(--f-display);font-weight:400;font-size:17px}
.when{font-size:12px;color:var(--muted);margin-top:2px}
.ncard{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-lg);padding:14px;margin-top:12px}
.nh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nh h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;flex:1;min-width:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.pager button{font-family:var(--f-display);font-size:14px;background:var(--ice);border:var(--bw) solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:48%;transition:transform .25s var(--pop)}
.pager button:active{transform:scale(.94)}
.pager .nx{margin-left:auto;background:var(--lamp)}

/* floating edit toggle */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border:var(--bw) solid var(--line);border-radius:999px;background:var(--lamp);padding:10px 18px;font-family:var(--f-display);font-size:16px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);transition:transform .25s var(--pop)}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
body.editing .fab{background:var(--pine)}
.editbar{position:sticky;top:0;z-index:4}
.editing-banner{margin:0 0 14px;padding:8px 12px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--lamp);font-size:13px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(46,58,75,.45)}
.spanel{position:relative;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--bg);border:var(--bw) solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:sheetUp .45s var(--pop)}
.spanel:focus{outline:none}
@keyframes sheetUp{from{transform:translateY(40%)}to{transform:none}}
@media (min-width:700px){.sheet{align-items:center}.spanel{border-bottom:var(--bw) solid var(--line);border-radius:var(--r-lg)}}
.spanel h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 44px 10px 0}
.close{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:36px;height:36px;border-radius:50%;border:var(--bw) solid var(--line);background:var(--surface);font-size:22px;line-height:1;cursor:pointer}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface);font-size:16px}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds label{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--surface);cursor:pointer;font-size:14px}
.kinds input{width:auto;accent-color:var(--ink)}
.sactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.sactions .sp{flex:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center;animation:pageIn .4s var(--pop)}
.update{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:41;border:var(--bw) solid var(--line);border-radius:999px;background:var(--lamp);padding:8px 16px;font-family:var(--f-display);cursor:pointer;max-width:calc(100% - 32px)}

/* travel hero + cover photo */
.hero .cloud{animation:drift 9s ease-in-out infinite}
.hero .cloud2{animation:drift 12s ease-in-out infinite reverse}
.hero .rays{transform-origin:304px 30px;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .fly{animation:fly 18s linear infinite}
@keyframes fly{0%{transform:translate(-50px,54px)}100%{transform:translate(420px,22px)}}
.cover{margin-top:8px}
.cover img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;border:var(--bw) solid var(--line);border-radius:var(--r-lg)}
.destline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px;font-size:13px;color:var(--muted)}
.destline .ico{width:18px;height:18px}

/* live: weather / time / money */
.dayhead .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wx{font-size:12px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap}
.hint,.panel p.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.panel h3 .ico{width:20px;height:20px;vertical-align:-3px}
.wxnow{display:flex;gap:12px;align-items:center;margin-top:6px}
.wxnow .big{font-size:40px;line-height:1}
.wxnow b{font-family:var(--f-display);font-weight:400;font-size:22px}
.wxnow small{display:block;color:var(--muted);font-size:12px}
.wxlist{display:grid;margin-top:10px;border:2px solid var(--soft);border-radius:var(--r-sm);overflow:hidden}
.wxrow{display:grid;grid-template-columns:62px 26px minmax(0,1fr) auto 58px;gap:6px;align-items:center;padding:5px 10px;font-size:14px;border-top:1px solid var(--soft)}
.wxrow:first-child{border-top:0}
.wxrow.trip{background:var(--lamp)}
.wxrow .d{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.wxrow .tx{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxrow .tp{font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.wxrow .pp{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.wxrow.trip .tx,.wxrow.trip .pp{color:var(--ink)}
.clocks{display:flex;gap:10px;margin-top:8px}
.clocks div{flex:1;min-width:0;border:2px solid var(--line);border-radius:var(--r-md);padding:8px 12px;background:var(--bg)}
.clocks small{display:block;font-size:12px;color:var(--muted)}
.clocks b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.fxline b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--ink);display:block}
.fxline small{display:block;font-size:12px}
.conv{display:flex;align-items:flex-end;gap:8px;margin-top:10px}
.conv label{flex:1;min-width:0}
.conv label span{display:block;font-size:12px;color:var(--muted)}
.conv input{width:100%;border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface);font-size:16px}
.conv .eq{font-family:var(--f-display);font-size:20px;padding-bottom:8px}
.georesults{display:grid;gap:8px;margin-top:12px}
.geo{text-align:left;border:var(--bw) solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:8px 12px;cursor:pointer}
.geo b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block}
.geo small{color:var(--muted);font-size:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);margin-right:2px;vertical-align:-1px}
.seg button .sw:last-of-type{margin-right:5px}
.changes{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}

.tab:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
@media (max-width:420px){.stop{grid-template-columns:52px 1fr;gap:8px}.stop::before{left:25px}.time span{font-size:12px;padding:1px 4px;min-width:40px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function migrate(d){
  const old=d.v||1;
  if(old<2){
    if(d.sample){const s=sample();s.look=d.look||OLD_LOOK();return migrate(s)}   // 還沒動過的範例：直接換成新版範例
    const sm=sample(),have=new Set(d.lists.map(l=>l.title));
    sm.lists.forEach(l=>{if(!have.has(l.title))d.lists.push(l)});   // 補上北海道冬季行前清單
    if(!Array.isArray(d.errands)||!d.errands.length)d.errands=sm.errands;
    if(!d.gifts||!d.gifts.items)d.gifts=sm.gifts;
    if(!Array.isArray(d.notes)||!d.notes.length)d.notes=sm.notes;
  }
  if(!Array.isArray(d.errands))d.errands=[];
  if(!d.gifts||typeof d.gifts!=="object")d.gifts={places:[],items:[]};
  if(!Array.isArray(d.gifts.places))d.gifts.places=[];
  if(!Array.isArray(d.gifts.items))d.gifts.items=[];
  if(!Array.isArray(d.notes))d.notes=[];
  if(!d.look||typeof d.look!=="object")d.look=old<3?OLD_LOOK():DEF_LOOK();   // 舊版（雪旅手帖）的使用者保留原本的名稱和樣子
  d.look=Object.assign(DEF_LOOK(),d.look);
  if(!PALETTES[d.look.palette])d.look.palette="snow";
  if(!ICONSETS[d.look.icons])d.look.icons="snow";
  if(!d.trip.home)d.trip.home="TWD";
  if(d.trip.cur==null)d.trip.cur="";
  d.days.forEach(x=>{if(!Array.isArray(x.stops))x.stops=[]});
  if(old<4&&d.trip.start&&d.days.length&&d.days[0].date!==d.trip.start)syncDays(d);   // 舊版改過旅程日期、但每一天沒跟上的，自動對齊一次
  d.v=4;return d;
}

function noteHtml(t){

/* time zones */
function tzOffset(tz){try{const n=new Date();return Math.round((new Date(n.toLocaleString("en-US",{timeZone:tz}))-new Date(n.toLocaleString("en-US",{timeZone:"UTC"})))/6e4)}catch(e){return null}}
function clock(tz){try{return new Intl.DateTimeFormat("zh-TW",{timeZone:tz,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date())}catch(e){return "—"}}
function diffText(tz){
  const a=tzOffset(tz),b=tzOffset("Asia/Taipei");if(a==null||b==null)return "";
  const m=a-b;if(m===0)return "和台灣同一個時間";
  const h=Math.abs(m)/60,s=Number.isInteger(h)?h:h.toFixed(1);
  return m>0?`當地比台灣快 ${s} 小時`:`當地比台灣慢 ${s} 小時`;
}

/* live cache (weather + exchange rate), kept out of backups */
const LKEY="tripnote:live";
let live={};try{live=JSON.parse(localStorage.getItem(LKEY)||"{}")||{}}catch(e){live={}}
function saveLive(){try{localStorage.setItem(LKEY,JSON.stringify(live))}catch(e){}}
const destKey=()=>{const D=state.trip.dest;return D?`${(+D.lat).toFixed(2)},${(+D.lon).toFixed(2)}`:""};
const fxKey=()=>`${state.trip.cur}>${state.trip.home}`;
function rainTxt(dl,i){const pp=dl.precipitation_probability_max,mm=dl.precipitation_sum;
  if(pp&&pp[i]!=null)return "💧"+pp[i]+"%";if(mm&&mm[i]!=null)return mm[i]>0?"☔"+mm[i]+"mm":"☔0";return ""}
function wxFor(iso){
  const w=live.w;if(!w||!iso||w.key!==destKey()||!w.daily)return null;
  const i=w.daily.time.indexOf(iso);if(i<0)return null;
  return {code:w.daily.weather_code[i],max:w.daily.temperature_2m_max[i],min:w.daily.temperature_2m_min[i],rain:rainTxt(w.daily,i)};
}
function getJSON(url,ms=12000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal,cache:"no-store"}).then(r=>{clearTimeout(t);if(!r.ok)throw new Error(r.status);return r.json()});
}
const shortTime=ms=>new Date(ms).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
/* 天氣：兩個來源，一個連不上就換另一個，並記住上次成功的那個 */
function metCode(sym){
  const b=String(sym||"").replace(/_(day|night|polartwilight)$/,""),sh=b.includes("showers"),th=b.includes("thunder");
  if(b==="clearsky")return 0;if(b==="fair")return 1;if(b==="partlycloudy")return 2;if(b==="cloudy")return 3;if(b==="fog")return 45;
  if(th)return 95;
  if(b.includes("sleet"))return 66;
  if(b.includes("snow"))return sh?(b.startsWith("heavy")?86:85):b.startsWith("light")?71:b.startsWith("heavy")?75:73;
  if(b.includes("rain"))return sh?(b.startsWith("light")?80:b.startsWith("heavy")?82:81):b.startsWith("light")?61:b.startsWith("heavy")?65:63;
  return 3;
}
function metno(j,tz){
  const ts=j&&j.properties&&j.properties.timeseries;if(!Array.isArray(ts)||!ts.length)throw new Error("mn");
  let f;try{f=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"})}catch(e){f=new Intl.DateTimeFormat("en-CA",{timeZone:"UTC",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hourCycle:"h23"})}
  const days=new Map();let cur=null;
  ts.forEach(e=>{
    const d=e.data||{},t=d.instant&&d.instant.details?d.instant.details.air_temperature:null;if(t==null)return;
    const nx=d.next_1_hours||d.next_6_hours||d.next_12_hours,sym=nx&&nx.summary?nx.summary.symbol_code:null;
    const o={};f.formatToParts(new Date(e.time)).forEach(x=>o[x.type]=x.value);
    const iso=`${o.year}-${o.month}-${o.day}`,hr=+o.hour;
    if(!cur)cur={temperature_2m:t,apparent_temperature:null,weather_code:metCode(sym)};
    let g=days.get(iso);if(!g){g={max:t,min:t,dist:99,code:3,pop:null,mm:0};days.set(iso,g)}
    const pd=(d.next_1_hours||d.next_6_hours||{}).details||{};
    if(pd.probability_of_precipitation!=null)g.pop=Math.max(g.pop==null?0:g.pop,pd.probability_of_precipitation);
    if(pd.precipitation_amount!=null)g.mm+=pd.precipitation_amount;
    g.max=Math.max(g.max,t);g.min=Math.min(g.min,t);
    const s6=d.next_6_hours&&d.next_6_hours.summary?d.next_6_hours.summary.symbol_code:sym,ds=Math.abs(hr-11);
    if(s6&&ds<g.dist){g.dist=ds;g.code=metCode(s6)}
  });
  const k=[...days.keys()];
  return {cur,daily:{time:k,weather_code:k.map(x=>days.get(x).code),temperature_2m_max:k.map(x=>days.get(x).max),temperature_2m_min:k.map(x=>days.get(x).min),precipitation_probability_max:k.some(x=>days.get(x).pop!=null)?k.map(x=>{const v=days.get(x).pop;return v==null?null:Math.round(v)}):null,precipitation_sum:k.map(x=>Math.round(days.get(x).mm*10)/10)}};
}
async function loadWx(D,k){
  const om=()=>getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${D.lat}&longitude=${D.lon}&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`,7000)
    .then(j=>{if(!j||!j.daily)throw new Error("om");live.w={key:k,at:Date.now(),src:"om",cur:j.current||null,daily:j.daily}});
  const mn=()=>getJSON(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${(+D.lat).toFixed(4)}&lon=${(+D.lon).toFixed(4)}`,10000)
    .then(j=>{live.w=Object.assign({key:k,at:Date.now(),src:"mn"},metno(j,D.tz))});
  const order=live.wsrc==="om"?[om,mn]:[mn,om];
  try{await order[0]()}catch(e){await order[1]()}
  live.wsrc=live.w.src;
}
async function loadFx(t,fk){
  /* 先讀同一個網站上的 rates.json（GitHub 每天自動從臺灣銀行牌告匯率抓下來）；讀不到才用國際參考匯率 */
  if(t.home==="TWD"&&location.protocol.startsWith("http")){
    try{const j=await getJSON("rates.json?t="+Date.now()),r=j&&j.rates&&j.rates[t.cur],v=r&&(r.cashSell||r.spotSell);
      if(v&&Date.now()-new Date(j.updated).getTime()<8*864e5){live.fx={key:fk,at:Date.now(),rate:v,src:"bot",cash:r.cashSell||0,spot:r.spotSell||0,time:new Date(j.updated).getTime()};return}}catch(e){}
  }
  const j=await getJSON(`https://open.er-api.com/v6/latest/${encodeURIComponent(t.cur)}`),r=j&&j.rates&&j.rates[t.home];
  if(!r)throw new Error("fx");live.fx={key:fk,at:Date.now(),rate:r,src:"era"};
}
let liveBusy=false,liveMsg="",wxErr=false;
async function refreshLive(force){
  const t=state.trip,D=t.dest;if(!D||liveBusy)return;
  if(!navigator.onLine){if(force)toast("目前沒有網路，先顯示上次的資料");return}
  const now=Date.now(),k=destKey(),fk=fxKey();
  const needW=force||!live.w||live.w.key!==k||now-live.w.at>3*36e5;
  const needF=!!(t.cur&&t.home&&t.cur!==t.home)&&(force||!live.fx||live.fx.key!==fk||now-live.fx.at>2*36e5);
  if(!needW&&!needF)return;
  liveBusy=true;liveMsg="更新中…";paintLive();
  const jobs=[];
  if(needW)jobs.push(loadWx(D,k).then(()=>{wxErr=false},e=>{wxErr=true;throw e}));
  if(needF)jobs.push(loadFx(t,fk));
  const res=await Promise.allSettled(jobs);liveBusy=false;saveLive();
  liveMsg=res.some(r=>r.status==="rejected")?"有些資料沒有更新成功，等一下再按「立即更新」試試":"";
  if(force&&!liveMsg)toast("已更新");
  paintLive();
  if(state.days.some(d=>d.id===cur))render(cur,{quiet:true});
}

  const h=Math.round(lon/15);return h===0?"UTC":`Etc/GMT${h>0?"-":"+"}${Math.abs(h)}`;

const TZ_OPTS=(()=>{const seen=new Map();CITIES.forEach(c=>{if(!seen.has(c[4]))seen.set(c[4],`${c[6]}・${c[0]}`)});Object.values(TZN).forEach(a=>a.forEach(([z])=>{if(!seen.has(z))seen.set(z,z.split("/")[1].replace(/_/g," "))}));Object.entries(TZ1).forEach(([k,z])=>{if(!seen.has(z))seen.set(z,z.split("/")[1].replace(/_/g," "))});return [...seen].map(([z,l])=>[z,`${l}（${z}）`])})();
let geoRes=[],geoSeq=0;
function geoPaint(note){
  const b=$("#geoRes");if(!b)return;
  b.innerHTML=geoRes.map((r,i)=>`<button type="button" class="geo" data-act="pickDest" data-i="${i}"><b>${esc(r.name)}</b><small>${esc([r.admin1,r.country].filter(Boolean).join("・"))}</small></button>`).join("")+(note?`<p class="hint">${esc(note)}</p>`:"");
}
function geoOnline(q){
  return getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=zh&format=json`,6000).then(j=>(j&&j.results)||[])
   .catch(()=>getJSON(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=jsonv2&addressdetails=1&limit=8&accept-language=zh-TW`,10000).then(a=>(a||[]).map(x=>{const ad=x.address||{},cc=String(ad.country_code||"").toUpperCase(),lon=+x.lon;
     return {name:x.name||String(x.display_name||"").split(",")[0],admin1:ad.state||ad.province||ad.county||"",country:ad.country||"",latitude:+x.lat,longitude:lon,timezone:tzFor(cc,lon),country_code:cc}})));
}
function searchGeo(q){
  if(!$("#geoRes"))return;
  if(!q){toast("請輸入城市名稱");return}
  const ql=q.toLowerCase(),seq=++geoSeq;
  geoRes=CITIES.filter(c=>c[0].includes(q)||q.includes(c[0])||c[1].toLowerCase().includes(ql)).map(c=>({name:c[0],admin1:c[1],country:c[6],latitude:c[2],longitude:c[3],timezone:c[4],country_code:c[5]}));
  if(!navigator.onLine){geoPaint(geoRes.length?"":"內建城市裡沒有這個地方；連上網路後可以搜尋更多地點");return}
  geoPaint("搜尋更多地點中…");
  geoOnline(q).then(list=>{if(seq!==geoSeq)return;
    list.forEach(r=>{if(!geoRes.some(g=>Math.abs(g.latitude-r.latitude)<.3&&Math.abs(g.longitude-r.longitude)<.3))geoRes.push(r)});
    geoPaint(geoRes.length?"":"找不到這個地方，換個寫法或用英文試試（例如 Sapporo、Bangkok）");
  }).catch(()=>{if(seq===geoSeq)geoPaint(geoRes.length?"":"線上搜尋目前連不上，先試試常見的城市名稱（例如 東京、首爾、曼谷）")});
}

  else{const all=tabsAll(),pi=all.findIndex(t=>t.id===prev),ci=all.findIndex(t=>t.id===cur);
    w.classList.toggle("left",ci<pi);w.classList.add("walking");w.style.left=x+"px";clearTimeout(walkT);walkT=setTimeout(()=>w.classList.remove("walking"),900)}

    onDelete(){state.info.splice(state.info.indexOf(g),1);commit()},deleteLabel:"刪除整個分類"})},
  addRow(el){const g=state.info.find(x=>x.id===el.dataset.group);openSheet({title:"新增資料",values:{kind:"text"},fields:ROW_FIELDS,onSave(v){g.rows.push({id:uid(),...v});commit()}})},
  editRow(el){const g=state.info.find(x=>x.id===el.dataset.group),r=g.rows.find(x=>x.id===el.dataset.id);openSheet({title:"修改資料",values:r,fields:ROW_FIELDS,onSave(v){Object.assign(r,v);commit()},
    onDelete(){g.rows.splice(g.rows.indexOf(r),1);commit()},deleteLabel:"刪除這一行"})},
  copy(el){const t=el.dataset.text;const ok=()=>toast("已複製");try{navigator.clipboard.writeText(t).then(ok,()=>toast("請長按文字複製"))}catch(e){toast("請長按文字複製")}},
  instTab(el){installTab=el.dataset.k;render(cur,{quiet:true})},
  toggleProd(el){const it=prodArr(el.dataset.kind).find(x=>x.id===el.dataset.id);it.done=el.checked;save();render(cur,{quiet:true})},
  addProd(el){const k=el.dataset.kind;openSheet({title:k==="errand"?"新增代買項目":"新增伴手禮",fields:PROD_FIELDS,values:{},
    onSave(v){if(!v.title){toast("請填品名");return false}return withImg(v,null).then(()=>{prodArr(k).push({id:uid(),done:false,...v});commit();closeSheet()}).then(()=>false)}})},
  editProd(el){const k=el.dataset.kind,arr=prodArr(k),it=arr.find(x=>x.id===el.dataset.id);openSheet({title:"修改",fields:PROD_FIELDS,values:it,
    onSave(v){return withImg(v,it).then(()=>{Object.assign(it,v);commit();closeSheet()}).then(()=>false)},onDelete(){arr.splice(arr.indexOf(it),1);commit()},deleteLabel:"刪除這一項"})},
  moveProd(el){const arr=prodArr(el.dataset.kind),i=arr.findIndex(x=>x.id===el.dataset.id),j=i+ +el.dataset.dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];commit()},
  addPlace(){openSheet({title:"新增購買地點",fields:PLACE_FIELDS,onSave(v){state.gifts.places.push({id:uid(),...v});commit()}})},
  editPlace(el){const arr=state.gifts.places,w=arr.find(x=>x.id===el.dataset.id);openSheet({title:"修改購買地點",fields:PLACE_FIELDS,values:w,onSave(v){Object.assign(w,v);commit()},onDelete(){arr.splice(arr.indexOf(w),1);commit()},deleteLabel:"刪除地點"})},
  addNote(){openSheet({title:"新增注意事項",fields:NOTE_FIELDS,onSave(v){state.notes.push({id:uid(),...v});commit()}})},
  editNote(el){const n=state.notes.find(x=>x.id===el.dataset.id);openSheet({title:"修改注意事項",fields:NOTE_FIELDS,values:n,onSave(v){Object.assign(n,v);commit()},onDelete(){state.notes.splice(state.notes.indexOf(n),1);commit()},deleteLabel:"刪除"})},
  moveNote(el){const arr=state.notes,i=arr.findIndex(x=>x.id===el.dataset.id),j=i+ +el.dataset.dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];commit()},
  export(){doExport()},
  setDest(){geoRes=[];openSheet({title:"設定目的地",fields:[{k:"q",label:"城市名稱",ph:"例如：札幌、首爾、Bangkok",hint:"常去的城市已內建，輸入中文就找得到；其他地方中文或英文都可以"}],
    extra:`<div id="geoRes" class="georesults"></div>`,saveLabel:"搜尋",onSave(v){searchGeo(v.q);return false}})},
  pickDest(el){const r=geoRes[+el.dataset.i];if(!r)return;const t=state.trip;
    t.dest={name:r.name,label:[r.name,r.admin1,r.country].filter(Boolean).join("・"),lat:r.latitude,lon:r.longitude,tz:r.timezone||"UTC",cc:r.country_code||""};
    if(CUR[t.dest.cc])t.cur=CUR[t.dest.cc];closeSheet();commit();toast("目的地："+r.name);refreshLive(true)},
  reloadLive(){refreshLive(true)},
  setTz(){const D=state.trip.dest;if(!D)return;const opts=TZ_OPTS.some(o=>o[0]===D.tz)?TZ_OPTS:[[D.tz,D.tz]].concat(TZ_OPTS);
    openSheet({title:"更改時區",values:{tz:D.tz},fields:[{k:"tz",label:"目的地的時區",type:"select",options:opts,hint:"選和目的地同一個國家、地區的城市"}],onSave(v){D.tz=v.tz;commit();refreshLive(true)}})},
  setCur(){const t=state.trip;openSheet({title:"幣別",values:{cur:t.cur||"",home:t.home||"TWD"},fields:[
    {k:"cur",label:"當地貨幣（3 個英文字母）",ph:"例如：JPY",hint:"日圓 JPY・韓元 KRW・泰銖 THB・越南盾 VND・歐元 EUR・美元 USD"},
    {k:"home",label:"你的貨幣",ph:"TWD",hint:"新台幣 TWD"}],
    onSave(v){const a=v.cur.toUpperCase(),b=(v.home||"TWD").toUpperCase();if((a&&!/^[A-Z]{3}$/.test(a))||!/^[A-Z]{3}$/.test(b)){toast("請填 3 個英文字母，例如 JPY");return false}
      t.cur=a;t.home=b;commit();refreshLive(true)}})},
  setPal(el){state.look.palette=el.dataset.k;save();applyLook();render(cur,{quiet:true})},
  setHero(el){const k=el.dataset.k;if(k==="photo"&&!state.look.heroImg){ACT.pickHero();return}state.look.hero=k;save();applyLook();render(cur,{quiet:true})},
  pickHero(){$("#heroFile").value="";$("#heroFile").click()},
  setIcons(el){state.look.icons=el.dataset.k;save();rerender()},
  import(){$("#importFile").value="";$("#importFile").click()}
};
const PROD_FIELDS=[{k:"title",label:"品名",ph:"例如：Royce 生巧克力"},{k:"en",label:"外文名稱（到店裡好找）",ph:"例如：ROYCE' Nama Chocolate"},
  {k:"img",label:"照片",type:"image",hint:"可以上傳商品照片或截圖，會自動縮小"},
  {k:"who",label:"給誰",ph:"例如：小美、同事"},{k:"qty",label:"數量",ph:"例如：2 盒"},
  {k:"price",label:"價格",ph:"例如：台灣蝦皮參考價 NT$500"},{k:"where",label:"去哪買",ph:"例如：新千歲機場"},
  {k:"note",label:"備註",type:"textarea",ph:"每行開頭打「-」會變成清單"}];
const PLACE_FIELDS=[{k:"name",label:"地點",ph:"例如：新千歲機場"},{k:"when",label:"什麼時候去",ph:"例如：最後一天"},{k:"best",label:"適合買",ph:"例如：一次買齊"},{k:"note",label:"說明",type:"textarea"}];
const NOTE_FIELDS=[{k:"title",label:"標題",ph:"例如：JR Pass 兌換"},{k:"tag",label:"小標籤",ph:"例如：已購買"},{k:"body",label:"內容",type:"textarea",ph:"每行開頭打「-」會變成清單"}];
function shrink(file,m=480,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(file)})}
function withImg(v,old){
  const f=$("#f_img"),rm=$("#f_img_rm");delete v.img;delete v.img_rm;
  if(rm&&rm.checked){v.img="";return Promise.resolve()}
  if(f&&f.files&&f.files[0])return shrink(f.files[0]).then(d=>{v.img=d}).catch(()=>{toast("這張照片讀不到，換一張試試");v.img=old?old.img:""});
  v.img=old?old.img:"";return Promise.resolve();
}
const ROW_FIELDS=[{k:"label",label:"名稱",ph:"例如：去程航班、飯店"},{k:"value",label:"內容",type:"textarea",ph:"例如：CI130 桃園 09:30 → 新千歲 14:00"},
  {k:"kind",label:"類型",type:"select",options:[["text","一般文字"],["map","地址（可開地圖）"],["phone","電話"],["link","網址"]]}];
function sortStops(d){d.stops.sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"))}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const t=e.target.closest(".tab[data-id]");if(t){go(t.dataset.id);return}
  const a=e.target.closest("[data-act]");if(!a||a.tagName==="FORM")return;
  const fn=ACT[a.dataset.act];if(!fn)return;
  if(a.type==="checkbox"){fn(a);return}
  if(a.closest("label.item")&&a.dataset.act==="editItem"){fn(a,e);return}
  fn(a,e);
});
document.addEventListener("change",e=>{const a=e.target.closest('input[type=checkbox][data-act]');if(a&&e.type==="change"){}});
document.addEventListener("submit",e=>{
  const n=e.target.closest('form[data-act="setName"]');
  if(n){e.preventDefault();state.look.appName=n.querySelector("input").value.trim()||"旅行手帖";save();applyLook();render(cur,{quiet:true});toast("名稱已更改");return}
  const f=e.target.closest('form[data-act="quickAdd"]');if(!f)return;e.preventDefault();
  const inp=f.querySelector("input"),v=inp.value.trim();if(!v)return;
  const l=state.lists.find(x=>x.id===f.dataset.list);l.items.push({id:uid(),text:v,note:"",done:false});state.sample=false;save();render(cur,{quiet:true});
  const again=document.getElementById("q_"+l.id);again&&again.focus();
});

/* edit toggle */
$("#fab").addEventListener("click",()=>{editing=!editing;document.body.classList.toggle("editing",editing);$("#fabtxt").textContent=editing?"✓ 完成":"✎ 編輯";rerender();if(!editing)toast("已儲存在這台裝置")});

/* ---------- backup ---------- */
async function doExport(){
  const data=JSON.stringify({app:"tripnote",exported:new Date().toISOString(),version:APP_VERSION,data:state},null,2);
  const d=new Date(),name=`${(state.trip.title||"旅程").replace(/[\\/:*?"<>|]/g,"")}-備份-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  const file=new File([data],name,{type:"application/json"});
  if(navigator.canShare&&/iPhone|iPad|Android/.test(navigator.userAgent)&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});toast("已匯出備份");return}catch(e){if(e&&e.name==="AbortError")return}
  }
  const url=URL.createObjectURL(file),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast("已下載備份檔");
}
$("#importFile").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result),d=j&&j.data?j.data:j;if(!valid(d))throw 0;
      openSheet({title:"匯入這份備份？",fields:[],extra:`<p style="margin:0">「${esc(d.trip.title||"旅程")}」，共 ${d.days.length} 天。<br><span style="color:var(--muted)">會取代這台裝置上目前的行程。</span></p>`,
       onDelete(){if(!d.look)d.look=state.look;state=migrate(d);save();applyLook();renderHead();render(state.days[0]?state.days[0].id:"lists");toast("匯入完成")},deleteLabel:"確定匯入",confirm:true})}
    catch(err){toast("這個檔案不是這個 App 的備份檔")}};
  r.readAsText(f);
});

/* swipe between pages */
let tx=null,ty=null;
$("#main").addEventListener("touchstart",e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY},{passive:true});
$("#main").addEventListener("touchend",e=>{if(tx===null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<45){const all=tabsAll(),i=all.findIndex(x=>x.id===cur),n=all[i+(dx<0?1:-1)];if(n)go(n.id)}},{passive:true});
addEventListener("resize",()=>moveWalker(null));
try{document.fonts.ready.then(()=>moveWalker(null))}catch(e){}
setInterval(tick,30000);

$("#heroFile").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  shrink(f,1200,.78).then(d=>{const L=state.look,old=[L.heroImg,L.hero];L.heroImg=d;L.hero="photo";save();
    if(!saveOK){L.heroImg=old[0];L.hero=old[1];save();toast("照片太大存不下，換一張試試");return}
    applyLook();render(cur,{quiet:true});toast("封面照片已更換")}).catch(()=>toast("這張照片讀不到，換一張試試"));
});
addEventListener("online",()=>refreshLive(false));

/* ---------- start ---------- */
applyLook();
renderHead();
(function(){let start=null;try{start=localStorage.getItem("tripnote:tab")}catch(e){}
  const today=state.days.find(d=>d.date===todayIso());render(today?today.id:(start||state.days[0].id))})();
setTimeout(()=>refreshLive(false),1500);
try{const pv=localStorage.getItem("tripnote:ver");if((pv&&pv!==APP_VERSION)||(!pv&&hadData))setTimeout(()=>toast(`已更新到版本 ${APP_VERSION}，到「設定」頁看更新內容`),900);localStorage.setItem("tripnote:ver",APP_VERSION)}catch(e){}

/* ---------- offline + updates ---------- */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const show=w=>{const b=$("#updateBtn");b.hidden=false;b.onclick=()=>{w.postMessage("skipWaiting")}};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)show(w)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload()});
}
